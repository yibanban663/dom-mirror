<!doctype html>
<html><head><meta charset="utf-8"><title>Synthetic capacity dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px Arial;background:#eef2f6;color:#16263a}
h1{margin:0 0 16px}.cards{display:flex;gap:16px;margin:16px 0}.card{background:white;padding:16px;width:25%;border-radius:8px}
input{padding:10px;width:300px}.table{height:420px;overflow:auto;background:white}table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:8px;border-bottom:1px solid #e5e9ee}canvas{background:white}#marker{position:fixed;right:8px;top:8px;width:24px;height:24px;background:rgb(24,139,67)}
</style></head><body>
<h1>Synthetic capacity dashboard</h1><div id="marker"></div>
<p>Session <span id="source-id"></span> · Result <span id="result">Ready</span></p>
<input id="command" placeholder="Press Enter for one operation" autocomplete="off">
<div class="cards"><div class="card">Customers <b>150</b></div><div class="card">Orders <b>480</b></div><div class="card">Renewals <b>92</b></div><div class="card">Region <b>Local only</b></div></div>
<canvas id="chart" width="800" height="160"></canvas>
<div class="table"><table><thead><tr><th>Customer</th><th>Region</th><th>Plan</th><th>Seats</th><th>Status</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const session = Array.from(crypto.getRandomValues(new Uint8Array(16)), value => value.toString(16).padStart(2,'0')).join('');
document.querySelector('#source-id').textContent = session;
document.querySelector('#rows').innerHTML = Array.from({length:150}, (_, i) => '<tr><td>Synthetic customer '+i+'</td><td>Local '+i%4+'</td><td>Standard</td><td>'+ (i%12+1)+'</td><td>Active</td><td>'+ (i*17+100)+'</td></tr>').join('');
const chart = document.querySelector('#chart').getContext('2d');
function draw(index) {
  chart.clearRect(0,0,800,160);
  for(let i=0;i<60;i++) { chart.fillStyle=i%2?'#597db0':'#25a092';chart.fillRect(i*13,160-((i*7+index*11)%130+10),9,(i*7+index*11)%130+10); }
}
draw(0);
let index = -1;
document.querySelector('#command').addEventListener('keydown', event => {
  if(event.key !== 'Enter') return;
  event.preventDefault(); index++;
  document.querySelector('#result').textContent = 'Measured task '+String(index).padStart(2,'0');
  document.querySelector('#marker').style.background = 'rgb('+(24+(index+1)*7)+',139,67)';
  draw(index);
  fetch('/events', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session,index})});
});
</script></body></html>
