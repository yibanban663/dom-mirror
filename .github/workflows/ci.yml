name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 语法与结构检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: server.js 语法检查
        run: node --check server.js
      - name: 客户端结构检查
        run: |
          node -e "
            const fs = require('fs');
            const s = fs.readFileSync('client/index.html', 'utf8');
            for (const key of ['mirrorHost', 'data-m=\"dom\"', 'applyPatches', 'buildMirror']) {
              if (!s.includes(key)) throw new Error('client missing: ' + key);
            }
            const open = (s.match(/<script/g) || []).length;
            const close = (s.match(/<\/script>/g) || []).length;
            if (open !== close) throw new Error('script tag mismatch');
            console.log('client ok');
          "
      - name: 协议文档与实现一致性（消息类型存在性）
        run: |
          node -e "
            const fs = require('fs');
            const srv = fs.readFileSync('server.js', 'utf8');
            for (const t of ['dom-snapshot', 'dom-patches', 'sstats', 'pong']) {
              if (!srv.includes(t)) throw new Error('server missing message type: ' + t);
            }
            console.log('protocol types ok');
          "

  docker:
    name: Docker 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t dom-mirror:ci .
      - name: 冒烟启动（内置演示源站 + HTTP 探活）
        run: |
          docker run -d --name ci-run -p 18088:8088 dom-mirror:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18088/ || true)
            [ "$code" = "200" ] && echo "HTTP 200 OK" && exit 0
            sleep 1
          done
          docker logs ci-run
          exit 1
