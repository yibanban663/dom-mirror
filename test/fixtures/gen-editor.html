<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gen-editor</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 24px; }
    #ce { border: 1px solid #aab; min-height: 60px; padding: 8px; border-radius: 4px; }
    #keys { margin-top: 12px; padding: 8px; background: #eef; font-family: Consolas, monospace; min-height: 18px; }
    #log { margin-top: 8px; font-family: Consolas, monospace; color: #456; }
  </style>
</head>
<body>
  <h3>富文本与键盘应用</h3>
  <div id="ce" contenteditable="true">初始内容</div>
  <p id="para">这是一段用于选区镜像验证的文字内容</p>
  <div id="term" tabindex="0" style="margin-top:12px;border:1px dashed #99a;padding:8px;">键盘捕获器：点我后打字/方向键</div>
  <button id="selbtn">程序化选区</button>
  <button id="feedbtn">加一行</button>
  <button id="txtbtn">改首行文本</button>
  <div id="feed"></div>
  <div id="keys">KEYS:</div>
  <div id="log">LOG:</div>
  <script>
    // 键盘型应用（终端/游戏类）：只监听 keydown，自身无可视输入控件
    const term = document.getElementById('term');
    const keys = document.getElementById('keys');
    const log = document.getElementById('log');
    const seq = [];
    term.addEventListener('keydown', (e) => {
      seq.push(e.key.length === 1 ? e.key : '[' + e.key + ']');
      keys.textContent = 'KEYS:' + seq.join('');
      if (e.key === 'Enter') { log.textContent = 'LOG:提交 ' + seq.join(''); seq.length = 0; }
    });
    document.getElementById('ce').addEventListener('input', () => {
      log.textContent = 'LOG:ce-input:' + document.getElementById('ce').textContent.length;
    });
    // 程序化选区（selectionchange 捕获路径）
    document.getElementById('selbtn').addEventListener('click', () => {
      const p = document.getElementById('para');
      const rng = document.createRange();
      rng.setStart(p.firstChild, 3);
      rng.setEnd(p.firstChild, 9);
      const s = document.getSelection();
      s.removeAllRanges();
      s.addRange(rng);
      log.textContent = 'LOG:sel-ok';
    });
    // 追加流（聊天/日志/表格常态）：纯末尾追加 + 首行文本原位修改（characterData）
    let fn = 0;
    document.getElementById('feedbtn').addEventListener('click', () => {
      fn++;
      const d = document.createElement('div');
      d.className = 'row';
      d.textContent = 'line-' + fn;
      document.getElementById('feed').appendChild(d);
    });
    document.getElementById('txtbtn').addEventListener('click', () => {
      const first = document.querySelector('#feed .row');
      if (first && first.firstChild) first.firstChild.data = 'line-edited';
    });
  </script>
</body>
</html>
